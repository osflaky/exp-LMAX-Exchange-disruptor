name: Java CI with Gradle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 11
          os: ubuntu-latest
          arch: arm64
          runner: ubuntu-24.04-arm
          expander_leg: ubuntu-latest-11-arm64
    name: Java ${{ matrix.java }} [${{ matrix.expander_leg }}]
    steps:
    - uses: actions/checkout@v2
    - name: Set up java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'zulu'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libs-and-reports-${{ matrix.java }}
        path: |
          build/libs
          build/reports
    timeout-minutes: 150
